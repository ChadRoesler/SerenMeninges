# ========================================================================
#  seren-meninges — the Seren shared core (SKELETON pyproject)
#  Chad owns release.yml / Trusted Publishing wiring; this is just the
#  package shape: deps minimal, the OS-keychain backend gated behind an extra.
# ========================================================================
[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-meninges"
description = "The connective tissue of the Seren brain: shared token resolution, config, auth, version, and viewer shell."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dynamic = ["version"]

# Core stays light. pyyaml for config; starlette ONLY if you keep the
# BaseHTTPMiddleware form of auth.py (it's already in every leaf via FastAPI,
# so it adds nothing to the real install). Drop it if you go pure-ASGI.
dependencies = [
  "pyyaml>=6",
  "starlette>=0.37",
]

[project.optional-dependencies]
# The OS keychain backend — opt-in. Headless Jetsons skip it and fall through
# to env-var tokens; desktops install it for Credential Manager / Keychain /
# Secret Service via resolve_token's keyring source.
keyring = ["keyring>=24"]

# Update checking (seren_meninges.updates) - opt-in, same shape as keyring.
# httpx to ask the index, packaging to compare the answer. Both are LAZILY
# imported inside the fetch, so seren_meninges.updates imports fine without
# this extra and reports status="unavailable" instead of exploding.
#
# httpx is capped <1 on purpose. It is pre-1.0, so a 1.0 is a signalled
# breaking change, and the family has already eaten one uncapped major this
# week (mcp 2.0.0 deleted FastMCP and every service silently dropped its /mcp
# endpoint). Cap it, don't hope. packaging is uncapped - Version /
# InvalidVersion are the two names we touch and they have been stable for
# years.
updates = ["httpx>=0.27,<1", "packaging>=23"]

dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27,<1", "packaging>=23"]

[project.urls]
Homepage = "https://github.com/ChadRoesler/SerenMeninges"
Repository = "https://github.com/ChadRoesler/SerenMeninges"
"Bug Tracker" = "https://github.com/ChadRoesler/SerenMeninges/issues"

[tool.setuptools]
packages = ["seren_meninges", "seren_meninges.viewer"]

[tool.setuptools.package-data]
# the viewer shell ships with the wheel
"seren_meninges.viewer" = ["*.html", "*.css"]

[tool.setuptools_scm]
# .git is one level above pyproject.toml (repo root)
root = ".."
version_scheme = "release-branch-semver"
version_file = "seren_meninges/_version.py"
# Strip the leading 'v' so "v1.2.3" → "1.2.3"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
# Used when no git tags exist (local dev, fresh clone). CI release builds
# override with SETUPTOOLS_SCM_PRETEND_VERSION.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
