<!DOCTYPE html>
<!-- ====================================================================
     seren_meninges viewer SHELL — the baseplate. The shared chrome around
     every Seren viewer. Leaves snap conventional fragment files onto the
     named slots via render_from_dir(); the leaf never edits this file. The
     token modal, api() helper, escapeHtml, and tab switching live here ONCE
     so all three services behave identically.
     ==================================================================== -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{TITLE}}</title>
    {{FAVICON}}
    <style>/*{{TOKENS_CSS}}*/</style>
    <style>/*{{LEAF_STYLES}}*/</style>
    <!--{{EXTRA_HEAD}}-->
</head>
<body>
    <div class="seren-topbar">
        <header class="seren-head">
            <div class="brand-block">
                <span class="brand">{{BRAND}}</span>
                <span class="subtitle">{{SUBTITLE}}</span>
            </div>
            <span class="spacer"></span>
            <!--{{HEAD_ASIDE}}-->
            <button id="tokenBtn" onclick="openToken()">🔑 Token</button>
        </header>
        <nav class="tabbar" id="tabbar"><!--{{TABS}}--></nav>
    </div>
    <main id="views"><!--{{VIEWS}}--></main>

    <div class="modal-back" id="tokenModal">
        <div class="modal">
            <h3>Bearer token</h3>
            <p class="muted">
                Stored in this browser only (localStorage) and sent as
                <code>Authorization: Bearer …</code>. Leave blank if the service runs open.
            </p>
            <input id="tokenInput" type="password" placeholder="paste token" style="width:100%">
            <div style="margin-top:14px; display:flex; gap:8px; align-items:center">
                <button onclick="clearToken()">Clear</button>
                <span style="flex:1"></span>
                <button onclick="closeToken()">Cancel</button>
                <button class="primary" onclick="saveToken()">Save</button>
            </div>
        </div>
    </div>

    <script>
// ── shared shell JS (identical across services) ──────────────────────
const TOKEN_KEY = "seren_token";
function getToken(){ return localStorage.getItem(TOKEN_KEY) || ""; }
function openToken(){ document.getElementById("tokenInput").value = getToken();
  document.getElementById("tokenModal").classList.add("open"); }
function closeToken(){ document.getElementById("tokenModal").classList.remove("open"); }
function saveToken(){ localStorage.setItem(TOKEN_KEY, document.getElementById("tokenInput").value.trim()); closeToken(); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); closeToken(); }

// dismiss without saving: click the dim backdrop (not the dialog), or press Esc
document.getElementById("tokenModal").addEventListener("click", e => {
  if (e.target.id === "tokenModal") closeToken();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeToken();
});

async function api(path, opts={}){
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  const tok = getToken();
  if (tok) headers["Authorization"] = "Bearer " + tok;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if (!res.ok) throw new Error(res.status + " " + res.statusText);
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res.text();
}

function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function showTab(id){
  document.querySelectorAll(".tabbar .tab").forEach(t => t.classList.toggle("active", t.dataset.tab===id));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id===id));
}
// activate the first tab on load
document.addEventListener("DOMContentLoaded", () => {
  const first = document.querySelector(".tabbar .tab");
  if (first) showTab(first.dataset.tab);
});

// ── polling without the jolt ─────────────────────────────────────────
// Every page here polls something and repaints it. Repainting an answer
// that did not change shoves a reader back to the top and swaps the node
// out from under an open inspector, so the rule lives here once: redraw
// only when the answer changed, and put the scroll back when you do.

// watch(url, ms, paint[, opts]) - fetch `url` now and then every `ms`; call
// paint(data) only when the answer differs from the last one painted. `url`
// may be a function returning the path (or a falsy value to sit a round out),
// for a page whose question moves or only matters on one tab. A slow answer
// is never overlapped by the next tick. Returns stop().
//
// `opts` is an onError function, or an object with any of:
//   onError(e)        a failed fetch, or an each/paint that threw. The next
//                     good answer is painted even if it matches the last.
//   signature(data)   what "the same answer" means; a string. Default: the
//                     whole JSON. Leave out the fields that only tick (an
//                     age, a clock) and they stop causing repaints.
//   fetch(path)       how to get the answer. Default: api(). For a page with
//                     its own fetcher, or one answer made of two requests.
//   each(data, changed)  every good answer, before any paint: the things
//                     that follow the clock without a redraw (a counter, a
//                     "refreshed at", ticking an age in place).
//   whileVisible      true: no rounds while the tab is hidden, and one the
//                     moment it is shown again.
//
// stop.check() asks again right now (after a POST, say) and resolves once an
// answer asked for after the call is in. stop.every(ms) changes the rate.
function watch(url, ms, paint, opts){
  const o = typeof opts === "function" ? { onError: opts } : (opts || {});
  const get = o.fetch || api, sigOf = o.signature || JSON.stringify;
  let sig = null, stopped = false, running = null, queued = null, timer = null;
  async function round(){
    try {
      const path = typeof url === "function" ? url() : url;
      if (!path) return;
      const data = await get(path);
      if (stopped) return;
      const s = path + "\n" + sigOf(data);
      const changed = s !== sig;
      if (o.each) await o.each(data, changed);
      if (!changed) return;
      await paint(data);
      sig = s;
    } catch (e) {
      sig = null;
      if (o.onError && !stopped) o.onError(e);
    }
  }
  // check() during a round does not settle for that round's answer: it may
  // have been asked before the POST the caller just made. One more round is
  // run after it, shared by everyone who asked meanwhile.
  function check(){
    if (stopped) return Promise.resolve();
    if (running) return queued || (queued = running.then(() => { queued = null; return check(); }));
    running = round().finally(() => { running = null; });
    return running;
  }
  function tick(){ if (!running && !(o.whileVisible && document.hidden)) check(); }
  function shown(){ if (!document.hidden) check(); }
  function every(n){
    if (n === ms && timer !== null) return;
    ms = n; clearInterval(timer);
    if (!stopped) timer = setInterval(tick, ms);
  }
  function stop(){
    stopped = true; clearInterval(timer);
    if (o.whileVisible) document.removeEventListener("visibilitychange", shown);
  }
  if (o.whileVisible) document.addEventListener("visibilitychange", shown);
  tick(); every(ms);
  stop.check = check; stop.every = every;
  return stop;
}

// keepingScroll(el, fn) - run fn (a repaint) and put the scroll back where
// it was: el's and the window's. `el` is an element or a selector; give a
// selector when fn replaces the node, and the new one is found afterwards.
// Waits for fn if it returns a promise; returns whatever fn returns.
function keepingScroll(el, fn){
  const find = () => typeof el === "string" ? document.querySelector(el) : el;
  const was = find();
  const top = was ? was.scrollTop : 0, left = was ? was.scrollLeft : 0;
  const wx = window.scrollX, wy = window.scrollY;
  const back = () => {
    const now = find();
    if (now) { now.scrollTop = top; now.scrollLeft = left; }
    window.scrollTo(wx, wy);
  };
  let out;
  try { out = fn(); }
  catch (e) { back(); throw e; }
  if (out && typeof out.then === "function") return out.finally(back);
  back();
  return out;
}

// ── leaf-supplied tab logic ──────────────────────────────────────────
//{{EXTRA_JS}}
        </script>
</body>
</html>
